#swagger/openapi.yaml

openapi: 3.0.0
info:
  title: Contacts API
  version: 1.0.0

paths:
  /contacts:
    get:
      $ref: './paths/contacts/get.yaml'
    post:
      $ref: './paths/contacts/post.yaml'

  /contacts/{contactId}:
    get:
      $ref: './paths/contacts/contactId/get.yaml'
    patch:
      $ref: './paths/contacts/contactId/patch.yaml'
    delete:
      $ref: './paths/contacts/contactId/delete.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
