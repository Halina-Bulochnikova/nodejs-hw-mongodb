#paths/contacts/get.yaml

tags:
  - Contacts
summary: Get all contacts
operationId: getContacts
description: Returns a list of contacts with optional pagination.
security:
  - bearerAuth: []

parameters:
  - $ref: '../../components/parameters/Pagination.yaml'

responses:
  '200':
    description: A list of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: '../../components/schemas/Contact.yaml'
