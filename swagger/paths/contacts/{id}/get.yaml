tags:
  - contacts
summary: Get a contact by ID
operationId: getContactById
description: Retrieves a contact by its unique ID.
security:
  - bearerAuth: []

parameters:
  - $ref: '../../../components/parameters/ContactId.yaml'

responses:
  '200':
    description: Contact found by id
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully retrieved contact!
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  '404':
    $ref: '../../../components/responses/NotFound.yaml'
