#paths/contacts/contactId/patch.yaml

tags:
  - contacts
summary: Update a contact
operationId: updateContact
description: Updates an existing contact by ID.
security:
  - bearerAuth: []

parameters:
  - $ref: '../../../components/parameters/ContactId.yaml'

requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          email:
            type: string
            format: email
          phoneNumber:
            type: string
          contactType:
            type: string
            enum: [work, home, personal]
          isFavourite:
            type: boolean
          photo:
            type: string
            format: binary
        required:
          - name
          - phoneNumber
          - contactType
responses:
  '200':
    description: Contact updated
    content:
     application/json:
       schema:
         type: object
         properties:
           status:
             type: string
             example: success
           message:
             type: string
             example: Contact created successfully
           data:
             $ref: '../../../components/schemas/Contact.yaml' 
  '404':
    $ref: '../../../components/responses/NotFound.yaml'
