#/swagger/paths/auth/send-reset-email.yaml

tags:
  - Auth
summary: Request password reset email
description: Sends password reset email to user with a reset token
operationId: requestPasswordResetEmail
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/auth.yaml#/RequestResetEmail'
responses:
  '200':
    description: Email sent successfully
  '404':
    $ref: '../../components/responses/NotFound.yaml'
    description: User not found
  '400':
    $ref: '../../components/responses/ValidationError.yaml'
    description: Validation error
