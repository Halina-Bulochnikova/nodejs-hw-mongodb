#/swagger/paths/auth/send-reset-email.yaml

tags:
  - auth
summary: Request password reset email
description: Sends password reset email to user with a reset token
operationId: requestPasswordResetEmail
security:
  - bearerAuth: []

requestBody:
  required: true
  content:
    application/json:
      schema:
        $ref: '../../components/schemas/RequestResetEmail.yaml'

responses:
  '200':
    description: Reset password email has been successfully sent.
    content:
      application/json:
        schema:
          type: object
          required: [status, message, data]
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Reset password email has been successfully sent.
            data:
              type: object
              example: {}

  '404':
    $ref: '../../components/responses/NotFound.yaml'
  '500':
    $ref: '../../components/responses/500.yaml'
