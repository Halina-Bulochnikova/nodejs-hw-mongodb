#/components/schemas/PaginatedContacts

      type: object
      required:
        - status
        - message
        - data
        - meta
      properties:
        status:
          type: integer
          example: 200
        message:
          type: string
          example: Contacts successfully found!
        data:
          type: array
          items:
            $ref: './Contact.yaml'
        meta:
          type: object
          required:
            - total
            - page
            - perPage
          properties:
            total:
              type: integer
              example: 100
            page:
              type: integer
              example: 1
            perPage:
              type: integer
              example: 10
