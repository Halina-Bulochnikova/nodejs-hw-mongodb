# swagger/components/responses/201.yaml

description: User successfully registered
content:
  application/json:
    schema:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          example: UmVmcmVzaFRva2VuU2FtcGxl
