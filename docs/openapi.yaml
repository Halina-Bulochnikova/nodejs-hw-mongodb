openapi: 3.0.0
info:
  version: 1.0.0
  title: Contacts API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description:
    This is a documentation of contacts app

tags:
  - name: auth
    description: Authentication endpoints
  - name: contacts
    description: Contacts management
 
servers:
  - url: http://localhost:3000
  - url: https://nodejs-hw-mongodb-a7nh.onrender.com

      

paths:
  /contacts:
    get:
      $ref: '../swagger/paths/contacts/get.yaml'
    post:
      $ref: '../swagger/paths/contacts/post.yaml'

  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'

  /auth/register:
    post:
      $ref: '../swagger/paths/auth/register.yaml'
  /auth/login:
    post:
      $ref: '../swagger/paths/auth/login.yaml'
  /auth/logout:
    post:
      $ref: '../swagger/paths/auth/logout.yaml'
  /auth/refresh:
    post:
      $ref: '../swagger/paths/auth/refresh.yaml'
  /auth/send-reset-email:
    post:
      $ref: '../swagger/paths/auth/send-reset-email.yaml'
  /auth/reset-pwd:
    post:
      $ref: '../swagger/paths/auth/reset-pwd.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      $ref: '../swagger/components/schemas/Contact.yaml'
    RegisterUserRequest:
      $ref: '../swagger/components/schemas/auth.yaml#/components/schemas/RegisterUserRequest'
    LoginUserRequest:
      $ref: '../swagger/components/schemas/auth.yaml#/components/schemas/LoginUserRequest'
    RequestResetEmail:
      $ref: '../swagger/components/schemas/auth.yaml#/components/schemas/RequestResetEmail'
    ResetPasswordRequest:
      $ref: '../swagger/components/schemas/auth.yaml#/components/schemas/ResetPasswordRequest'